name: Security

on:
  push:
    branches: [main]
    paths:
      - 'go.mod'
      - 'go.sum'
      - '**/*.go'
      - '.github/workflows/security.yml'
  pull_request:
    branches: [main]
    paths:
      - 'go.mod'
      - 'go.sum'
      - '**/*.go'
      - '.github/workflows/security.yml'
  schedule:
    # Weekly Monday at 03:17 UTC to detect newly published Go stdlib/module advisories.
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  govulncheck:
    name: Go vulnerability check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck across target platforms
        shell: bash
        run: |
          gobin="$(go env GOBIN)"
          if [ -z "$gobin" ]; then
            gobin="$(go env GOPATH)/bin"
          fi
          "$gobin/govulncheck" ./...
          "$gobin/govulncheck" github.com/egoist/mygo/cmd/mygo
          GOOS=darwin GOARCH=arm64 "$gobin/govulncheck" ./...
          GOOS=windows GOARCH=amd64 "$gobin/govulncheck" ./...
