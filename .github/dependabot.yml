version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      golang-x:
        patterns:
          - 'golang.org/x/*'
    ignore:
      # Evaluate MyGo framework upgrades deliberately with full native GUI verification.
      - dependency-name: github.com/egoist/mygo
        update-types:
          - version-update:semver-minor
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
